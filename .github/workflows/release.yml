name: Build Micro Downloader installable releases
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install PySide6 Essentials and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Linux runtime tools, Qt smoke-test libraries and package builders
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2 curl p7zip-full libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 zstd rpm dpkg-dev
      - name: Windows backend and installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install aria2 7zip innosetup -y --no-progress
          $aria = Get-ChildItem "$env:ChocolateyInstall\lib\aria2" -Recurse -File -Filter aria2c.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $aria) { throw 'Real aria2c.exe not found' }
          "MICRO_DOWNLOADER_ARIA2_BIN=$aria" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $seven = Join-Path $env:ProgramFiles '7-Zip'
          if (-not ((Test-Path "$seven\7z.exe") -and (Test-Path "$seven\7z.dll"))) { throw '7z.exe and 7z.dll required' }
          "MICRO_DOWNLOADER_7ZIP_DIR=$seven" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          "MICRO_DOWNLOADER_ISCC=$iscc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Python source validation
        run: python -m compileall -q micro_downloader run.py scripts
      - name: Core regression tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Qt GUI regression (headless)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen python -m scripts.smoke_ui
      - name: GUI download engine retry regression (headless)
        if: runner.os == 'Linux'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen python -m scripts.smoke_backend_ui
      - name: Windows native Qt/font availability probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtGui import QFontDatabase; a=QApplication([]); print('Windows Qt platform/font probe:', len(QFontDatabase.families()), 'families'); a.quit()"
      - name: Build native installable packages
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.5.2"
          fi
          python scripts/build_release.py --mode installer --version "$VERSION"
      - name: Verify bundled Windows aria2 RPC and transfer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Resolve-Path '.\dist\MicroDownloader\_internal\bin\aria2c.exe').Path
          python -m scripts.smoke_aria2 --binary "$binary"
      - name: Verify Linux aria2 RPC and transfer
        if: runner.os == 'Linux'
        shell: bash
        run: python -m scripts.smoke_aria2 --binary "$(command -v aria2c)"
      - name: Linux frozen app launch smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          export MICRO_DOWNLOADER_DATA_DIR="$RUNNER_TEMP/micro-downloader-smoke"
          ./dist/MicroDownloader/MicroDownloader --self-test
          test -f release/*.deb
          test -f release/*.rpm
          test -f release/*.pkg.tar.zst
      - name: Windows frozen app launch smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MICRO_DOWNLOADER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'micro-downloader-smoke'
          $env:MICRO_DOWNLOADER_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP 'micro-downloader-selftest.log'
          # GitHub's Windows runner has native Windows fonts, while Qt's
          # offscreen platform expects an external Qt font directory and can
          # abort when bundled by PyInstaller. Test using the *actual Windows*
          # Qt platform plugin shipped with the installer instead.
          $env:QT_QPA_PLATFORM = 'windows'
          # A PyInstaller --windowed exe has no console stderr. Save a report
          # before importing Qt and print it whether the process succeeds or not.
          # Windows GUI-subsystem executables may return control to PowerShell
          # immediately. In that case $LASTEXITCODE is null and the report is
          # checked before the app has even run its self-test.
          # Wait on the Process object and inspect its real exit code instead.
          $exe = (Resolve-Path '.\dist\MicroDownloader\MicroDownloader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) {
            Write-Host 'ERROR: Windows GUI self-test exceeded 90 seconds.'
            $process.Kill()
            $process.WaitForExit()
            $exitCode = 124
          } else {
            $exitCode = $process.ExitCode
          }
          Write-Host "Windows GUI self-test exit code: $exitCode"
          if (Test-Path $env:MICRO_DOWNLOADER_SELF_TEST_LOG) {
            Write-Host '------ Frozen GUI self-test diagnostic ------'
            Get-Content $env:MICRO_DOWNLOADER_SELF_TEST_LOG
          } else {
            Write-Host 'No self-test report was written: executable failed before entrypoint.'
          }
          if ($exitCode -ne 0) { throw "Windows native-platform GUI self-test failed with code $exitCode (see diagnostic above)" }
          if (-not (Get-ChildItem release -Filter '*-Setup.exe')) { throw 'Setup missing' }
      - name: Upload Windows startup diagnostic when a job fails
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: micro-downloader-windows-selftest-log
          path: ${{ runner.temp }}/micro-downloader-selftest.log
          if-no-files-found: ignore
      - name: Upload native installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: micro-downloader-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source to validate release assets
        uses: actions/checkout@v6
      - name: Download Windows setup artifact
        uses: actions/download-artifact@v4
        with:
          name: micro-downloader-windows
          path: artifacts/windows
      - name: Download Linux installer artifact
        uses: actions/download-artifact@v4
        with:
          name: micro-downloader-linux
          path: artifacts/linux
      - name: Normalize, verify and checksum all installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/prepare_release_assets.py --artifacts artifacts --out release --version "$VERSION"
          python3 scripts/verify_release_assets.py --version "$VERSION" --dir release
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write direct installer links and checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > RELEASE_NOTES.md <<EOF
          ## Download Micro Downloader ${VERSION}

          Select the installer for your operating system:

          | Operating system | Direct download |
          |---|---|
          | Windows 10/11 (x64) | [Download Windows Setup (.exe)](${BASE}/MicroDownloader-${VERSION}-windows-x64-Setup.exe) |
          | Manjaro / Arch Linux (x64) | [Download Arch package (.pkg.tar.zst)](${BASE}/MicroDownloader-${VERSION}-linux-x64.pkg.tar.zst) |
          | Ubuntu / Debian (x64) | [Download Debian package (.deb)](${BASE}/MicroDownloader-${VERSION}-linux-x64.deb) |
          | Fedora / RPM-based (x64) | [Download RPM package (.rpm)](${BASE}/MicroDownloader-${VERSION}-linux-x64.rpm) |

          Install the package for your OS. Python and Qt are bundled. Linux packages require system aria2 and curl.
          Existing downloads and saved source URLs are preserved in user data directories.

          [SHA256 checksums](${BASE}/SHA256SUMS.txt)
          EOF
      - name: Publish GitHub Release with direct installers
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
