name: Bug report
description: Report a reproducible defect in downloads, recovery, or the interface.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please redact credentials, private URLs and sensitive file paths from logs."
  - type: input
    id: version
    attributes:
      label: Micro Downloader version
      placeholder: "0.5.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and filesystem
      placeholder: "Manjaro KDE / ext4, Windows 11 / NTFS, etc."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs (optional)
      render: shell
